{% extends 'base.html' %}
{% block title %}Audit Log{% endblock %}
{% block content %}
<div class="page-head"><h1>📜 Audit Log <span class="count">(last 200)</span></h1></div>
<div class="card">
  <table class="table">
    <thead><tr><th>Time</th><th>User</th><th>Action</th><th>Details</th></tr></thead>
    <tbody>
    {% for r in rows %}
      <tr>
        <td>{{ r.created_at }}</td>
        <td>{{ r.username }}</td>
        <td><span class="badge badge-muted">{{ r.action }}</span></td>
        <td>{{ r.details }}</td>
      </tr>
    {% else %}
      <tr><td colspan="4" class="empty">No activity yet.</td></tr>
    {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
