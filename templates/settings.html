{% extends 'base.html' %}
{% block title %}Company Settings{% endblock %}
{% block content %}
<div class="page-head"><h1>⚙️ Company Settings</h1></div>

<form method="post" enctype="multipart/form-data">
<div class="grid-2">
  <div class="card">
    <h3>Company Info</h3>
    <label>Company Name</label>
    <input type="text" name="company_name" value="{{ s.company_name }}" required>
    <label>Address</label>
    <input type="text" name="address" value="{{ s.address }}">
    <div class="grid-2">
      <div><label>Phone</label><input type="text" name="phone" value="{{ s.phone }}"></div>
      <div><label>Email</label><input type="text" name="email" value="{{ s.email }}"></div>
      <div><label>NTN</label><input type="text" name="ntn" value="{{ s.ntn }}"></div>
      <div><label>STRN</label><input type="text" name="strn" value="{{ s.strn }}"></div>
    </div>
    <label>Company Logo {% if s.logo_path %}<span class="muted">(current: {{ s.logo_path }})</span>{% endif %}</label>
    <input type="file" name="logo" accept="image/*">
  </div>

  <div class="card">
    <h3>Bank Details</h3>
    <label>Bank Name</label>
    <input type="text" name="bank_name" value="{{ s.bank_name }}">
    <label>Account Title</label>
    <input type="text" name="account_title" value="{{ s.account_title }}">
    <div class="grid-2">
      <div><label>Account Number</label><input type="text" name="account_number" value="{{ s.account_number }}"></div>
      <div><label>IBAN</label><input type="text" name="iban" value="{{ s.iban }}"></div>
    </div>
  </div>

  <div class="card">
    <h3>Invoice Settings</h3>
    <div class="grid-2">
      <div><label>Default GST %</label><input type="number" step="0.01" name="gst_percent" value="{{ s.gst_percent }}"></div>
      <div><label>Invoice Prefix</label><input type="text" name="invoice_prefix" value="{{ s.invoice_prefix }}" placeholder="CC"></div>
      <div><label>Starting Number</label><input type="number" name="invoice_start_number" value="{{ s.invoice_start_number }}"></div>
      <div><label>Authorized Signatory</label><input type="text" name="authorized_signatory" value="{{ s.authorized_signatory }}"></div>
    </div>
    <label>Signature Image {% if s.signature_path %}<span class="muted">(current: {{ s.signature_path }})</span>{% endif %}</label>
    <input type="file" name="signature" accept="image/*">
    <label>Invoice Footer Note</label>
    <input type="text" name="invoice_footer" value="{{ s.invoice_footer }}" placeholder="e.g. Payment due within 15 days...">
  </div>
</div>

<div class="card">
  <button class="btn btn-primary">💾 Save Settings</button>
  <p class="muted">Note: These settings apply to new invoices. Old invoices keep their original details.</p>
</div>
</form>
{% endblock %}
